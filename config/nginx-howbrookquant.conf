# nginx server block for howbrookquant.benhowbrook.xyz (mainnet live site, port 3002).
#
# Install:
#   sudo cp config/nginx-howbrookquant.conf \
#            /etc/nginx/sites-available/howbrookquant.benhowbrook.xyz
#   sudo ln -s /etc/nginx/sites-available/howbrookquant.benhowbrook.xyz \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then issue the TLS cert (after DNS A record points at this server):
#   sudo certbot --nginx -d howbrookquant.benhowbrook.xyz
# Certbot will rewrite this file to add the 443 block and HTTP→HTTPS redirect.

server {
    listen 80;
    server_name howbrookquant.benhowbrook.xyz;

    location / {
        proxy_pass         http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300;
    }
}
